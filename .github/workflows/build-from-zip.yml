name: Build APK from ZIP

on:
  push:
    paths:
      - "*.zip"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract App
        run: |
          mkdir extracted
          unzip -q WeekMap_OneUpload.zip -d extracted
          echo "PROJECT_DIR=$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Timesheet-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
